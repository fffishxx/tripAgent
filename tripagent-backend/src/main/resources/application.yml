server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

spring:
  application:
    name: tripagent-backend
  config:
    # 本地可选 .env（KEY=VALUE）；Docker/生产仍使用环境变量
    import: optional:file:.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    time-zone: Asia/Shanghai
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
  mvc:
    throw-exception-if-no-handler-found: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  sql:
    init:
      mode: never

gateway:
  base-url: ${GATEWAY_BASE_URL:http://127.0.0.1:10086}
  # 必须与 Gateway 的 gateway.internal-token 一致；生产必须通过环境变量注入
  internal-token: ${GATEWAY_INTERNAL_TOKEN:}

security:
  user-jwt:
    # 私钥默认从用户目录加载，不进入仓库；可通过环境变量覆盖为 file:/path 或 classpath:path
    private-key: ${USER_JWT_PRIVATE_KEY:}
    public-key: ${USER_JWT_PUBLIC_KEY:}
    issuer: ${USER_JWT_ISSUER:tripagent-java}
    audience: ${USER_JWT_AUDIENCE:tripagent}
    expire-hours: ${USER_JWT_EXPIRE_HOURS:24}
  agent:
    # Python Agent 调 /api/agent/** 时使用；生产环境必须通过环境变量注入
    service-token: ${AGENT_SERVICE_TOKEN:}
  cors:
    # 逗号分隔的白名单；为空表示不启用 CORS（推荐同源反向代理）
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}

oss:
  # 头像由 Java 服务端代理上传，AccessKey 只能通过环境变量注入，禁止提交到仓库
  endpoint: ${OSS_ENDPOINT:}
  bucket: ${OSS_BUCKET:}
  access-key-id: ${OSS_ACCESS_KEY_ID:}
  access-key-secret: ${OSS_ACCESS_KEY_SECRET:}
  # 可选自定义域名/CDN；为空时使用 https://{bucket}.{endpoint}/{key}
  public-base-url: ${OSS_PUBLIC_BASE_URL:}
  avatar-prefix: ${OSS_AVATAR_PREFIX:avatars}
  max-avatar-bytes: ${OSS_MAX_AVATAR_BYTES:5242880}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: assign_id

springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html

knife4j:
  enable: true
  setting:
    language: zh_cn

logging:
  config: classpath:logback-spring.xml
  level:
    com.tripagent: debug
    org.springframework: info
