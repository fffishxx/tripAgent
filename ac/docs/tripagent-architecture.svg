<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="tripagent-architecture-title tripagent-architecture-desc" id="tripagent-architecture-root">
        <title id="tripagent-architecture-title">TripAgent 整体架构</title>
        <desc id="tripagent-architecture-desc">从网关与会话执行进入 LangGraph 意图路由，分流到出行规划子图、路线、打车、知识问答，再连接 DeepSeek、高德、滴滴 MCP 与平台存储服务的结构图。</desc>
        <defs>
      <style>@import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&amp;family=Geist:wght@400;500;600&amp;family=Geist+Mono:wght@400;500;600&amp;family=Noto+Serif:ital@0;1&amp;family=Noto+Sans+KR:wght@400;500;600&amp;family=Noto+Serif+KR:wght@400&amp;family=Noto+Sans+TC:wght@400;500;600&amp;family=Noto+Serif+TC:wght@400&amp;display=swap');
      #tripagent-architecture-root { --color-paper:   #f5f5f5;
      --color-paper-2: #ececec;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-soft:    #5a6580;
      --color-accent:  #bf4520;
      --color-link:    #2e5aa8;
      --color-rule:    rgba(45,49,66,0.12);
      --font-sans:     'Geist', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif SC', 'Songti SC', serif;
      --font-mono:     'Geist Mono', ui-monospace, monospace; }
      #tripagent-architecture-root { font-family: var(--font-sans); color: var(--color-ink); }
      #tripagent-architecture-root .subtitle { font-size: 0.95rem;
      line-height: 1.6;
      color: var(--color-muted);
      margin-bottom: 1.75rem; }
      #tripagent-architecture-root .diagram-container { width: 100%; overflow-x: auto; }
      #tripagent-architecture-root .card-header { display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 0.75rem; }
      #tripagent-architecture-root .card-dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }
      #tripagent-architecture-root .card-dot.coral { background: var(--color-accent); }
      #tripagent-architecture-root .card-dot.ink { background: var(--color-ink); }
      #tripagent-architecture-root .card-dot.muted { background: var(--color-muted); }
      @media print {
#tripagent-architecture-root .diagram-container { overflow-x: visible; }
}</style>
          <marker id="tripagent-architecture-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/></marker>
